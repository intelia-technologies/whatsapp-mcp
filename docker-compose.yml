services:
  whatsapp-mcp:
    # Docker is a deliberate, isolated development runtime. The native
    # launchd service owns ./data in normal operation.
    profiles: ["docker-dev"]
    build: .
    container_name: whatsapp-mcp-docker-dev
    ports:
      - '127.0.0.1:${WHATSAPP_MCP_DOCKER_PORT:-18081}:8080'
    environment:
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TIMEZONE=${TIMEZONE:-UTC}
      - MEDIA_AUTO_DOWNLOAD_ENABLED=${MEDIA_AUTO_DOWNLOAD_ENABLED:-true}
      - MEDIA_AUTO_DOWNLOAD_FROM_HISTORY=${MEDIA_AUTO_DOWNLOAD_FROM_HISTORY:-false}
      - MEDIA_AUTO_DOWNLOAD_MAX_SIZE_MB=${MEDIA_AUTO_DOWNLOAD_MAX_SIZE_MB:-10}
      - MEDIA_AUTO_DOWNLOAD_TYPES=${MEDIA_AUTO_DOWNLOAD_TYPES:-image,audio,sticker}
    volumes:
      # Never share the native service's SQLite database, WAL, or auth session.
      - ${WHATSAPP_MCP_DOCKER_DATA_DIR:-./data-docker}:/app/data
    restart: "no"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
